@let member = user();

<section class="card flex flex-col gap-6">
  <div class="flex items-start justify-between gap-4">
    <div>
      <h2 class="text-2xl font-semibold text-slate-900">{{ member.fullName }}</h2>
      <div class="mt-2 flex items-center gap-2 text-sm text-slate-500">
        <svg class="h-4 w-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M4 7h16M4 12h16M4 17h10" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Account #{{ member.accountNumber }}</span>
      </div>
    </div>

    <span 
        class="rounded-full text-slate-700 text-xs font-semibold px-4 py-1.5"
        [class.bg-green-100]="member.isActive"
        [class.bg-red-100]="!member.isActive"
    >
      {{ member.isActive ? "ACTIVE" : "INACTIVE" }}
    </span>
  </div>

  <hr class="border-slate-200" />

  <div class="grid gap-6 md:grid-cols-2">
    <div class="flex gap-3">
      <div class="mt-1 text-slate-400">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 21s7-4.35 7-10a7 7 0 10-14 0c0 5.65 7 10 7 10z" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12" cy="11" r="2.5" />
        </svg>
      </div>
      <div>
        <p class="tracking-wide text-slate-500">Location</p>
        <p class="text-base text-slate-900">{{ member.location }}</p>
      </div>
    </div>

    <div class="flex gap-3">
      <div class="mt-1 text-slate-400">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M22 16.92v3a2 2 0 01-2.18 2 19.86 19.86 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.86 19.86 0 012.08 4.2 2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <p class="tracking-wide text-slate-500">Phone Number</p>
        <p class="text-base text-slate-900">{{ member.phoneNumber }}</p>
      </div>
    </div>
  </div>
</section>
