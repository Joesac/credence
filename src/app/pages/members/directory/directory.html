<section class="mt-6 flex justify-center">
    <div class="px-4 w-full flex flex-col gap-4">
        <app-inputfield
            [(value)]="searchQuery"
            placeholder="Search for members..."
        />

        <app-data-table 
            [data]="filteredMembers()"
            [columns]="tableConfig"
            [(currentPage)]="currentPage"
            [(pageSize)]="pageSize"
            [totalRecords]="totalRecords()" 
        />
    </div>
</section>
