<section class="mt-6 px-4 w-full max-width">

    <app-member-selection-dropdown 
        (onSelectMember)="onSelectMember($event)"
    />
    
    @if (selectedMember()) {
        <section class="mt-4 flex flex-col gap-4 w-full">
            <app-user-details
                [user]="selectedMember()!"
            />

            <app-loan-details [details]="loanDetails()" />

            <form (submit)="onSubmit($event)">
                <div class="card flex flex-col gap-4">
                    <app-inputfield
                        [formField]="repaymentForm.amount"
                        label="Amount"
                        inputMode="decimal"
                        placeholder="Enter repayment amount"
                    />

                    <app-inputfield
                        [formField]="repaymentForm.notes"
                        label="Notes (optional)"
                        placeholder="Enter repayment notes"
                        type="textarea"
                    />

                    <div class="flex justify-end">
                        <button
                            type="submit"
                            class="btn-primary"
                            [disabled]="repaymentForm().invalid()"
                        >Make Repayment</button>
                    </div>
                </div>
            </form>
        </section>
    }
</section>
