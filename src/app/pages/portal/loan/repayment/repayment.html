<div class="mt-6 px-4 w-full">
    
    <div class="w-full flex justify-between items-end gap-4">
        <div class="flex w-full flex-1 gap-4 max-width">
            <app-member-selection-dropdown
                (onSelectMember)="onSelectMember($event)" />
        
            <app-loan-selection-dropdown-component
                [memberId]="selectedMember()?.id ?? null"
                (onSelectLoan)="onSelectLoan($event)"
            />
        </div>

        <button 
            (click)="viewRepayments.set(!viewRepayments())"
            [matButton]="viewRepayments() ? 'filled' : 'tonal'">{{ viewRepayments() ? 'Repay Loan' : 'View Repayments' }}</button>
    </div>
    
    @if (!viewRepayments()) {
        <section class="mt-4 flex flex-col gap-4 w-full">
            @if (selectedMember()) {
                    <app-member-summary [user]="selectedMember()!" />
            }

            @if (loanDetails()) {
                <app-loan-details [details]="loanDetails()!" />
            }

            @if (selectedMember() && loanDetails()) {
                <form (submit)="onSubmit($event)" >
                    <div class="card flex flex-col gap-4 relative">
                        @if (selectedMember()?.is_disabled) {
                            <app-disable-cover-component
                                [header]="'Member is disabled'"
                                [message]="'Please enable the member to accept Repayments'" />
                        }

                        <app-inputfield
                            [formField]="repaymentForm.amount"
                            label="Amount"
                            inputMode="decimal"
                            placeholder="Enter repayment amount"
                        />

                        <app-inputfield
                            [formField]="repaymentForm.notes"
                            label="Notes (optional)"
                            placeholder="Enter repayment notes"
                            type="textarea"
                        />

                        <div class="flex justify-end">
                            <button
                                type="submit"
                                class="btn-primary"
                                [disabled]="repaymentForm().invalid() || !selectedLoan()"
                            >Make Repayment</button>
                        </div>
                    </div>
                </form>
            }
        </section>
    } @else {
        <section class="mt-4">
            <app-loan-repayment-list [loanId]="selectedLoan()?.id ?? ''" (onRepaymentCancelled)="onRepaymentCancelled()" />
        </section>
    }
</div>
