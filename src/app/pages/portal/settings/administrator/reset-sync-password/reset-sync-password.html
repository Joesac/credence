<section class="py-4">
  <form class="space-y-6" (submit)="onSubmit($event)">
    @if (isSyncPasswordSet()) {
      <app-inputfield
        [formField]="resetForm.currentPassword"
        label="Current Cloud Sync Password"
        type="password"
        placeholder="Enter current cloud sync password"
      />
    }

    <app-inputfield
      [formField]="resetForm.newPassword"
      label="New Cloud Sync Password"
      type="password"
      placeholder="Enter new cloud sync password"
    />

    <app-inputfield
      [formField]="resetForm.confirmPassword"
      label="Confirm New Password"
      type="password"
      placeholder="Confirm new cloud sync password"
    />

    <div class="flex justify-end">
      <button
        type="submit"
        matButton="filled"
        color="primary"
        [disabled]="resetForm().invalid() || isSubmitting()"
      >
        {{ isSubmitting() ? 'Saving...' : (isSyncPasswordSet() ? 'Update Password' : 'Set Password') }}
      </button>
    </div>
  </form>
</section>
