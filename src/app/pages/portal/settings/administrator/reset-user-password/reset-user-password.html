<section class="py-4">
  <form class="space-y-6" (submit)="onSubmit($event)">
    <app-dropdown
      [formField]="resetForm.userId"
      label="Select User"
      [collection]="userOptions()"
      [inputReadonly]="true"
    />

    <app-inputfield
      [formField]="resetForm.newPassword"
      label="New Password"
      type="password"
      placeholder="Enter new password"
    />

    <app-inputfield
      [formField]="resetForm.confirmPassword"
      label="Confirm Password"
      type="password"
      placeholder="Confirm new password"
    />

    <app-inputfield
      [formField]="resetForm.actorPassword"
      label="Your Administrator Password"
      type="password"
      placeholder="Enter your password to authorize"
    />

    <div class="flex justify-end">
      <button
        type="submit"
        matButton="filled"
        color="primary"
        [disabled]="resetForm().invalid() || isSubmitting()"
      >
        {{ isSubmitting() ? 'Resetting...' : 'Reset Password' }}
      </button>
    </div>
  </form>
</section>
