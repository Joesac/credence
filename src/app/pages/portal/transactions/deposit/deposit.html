<section class="mt-6 px-4 w-full max-width">

    <app-member-selection-dropdown 
        (onSelectMember)="onSelectMember($event)"
    />
    
    @if (selectedMember()) {
        <section class="mt-4 flex flex-col gap-4 w-full">
            <app-user-details
                [user]="selectedMember()!"
                [showFinancialStatus]="true"
            />

            <form (submit)="onSubmit($event)">
                <div class="card flex flex-col gap-4">
                    <app-dropdown 
                        [formField]="depositForm.paymentMethod"
                        label="Payment Method"
                        placeholder="Select payment method"
                        [collection]="PAYMENT_METHODS"
                    />

                    <app-inputfield
                        [formField]="depositForm.amount"
                        label="Amount"
                        inputMode="decimal"
                        placeholder="Enter deposit amount"
                    />

                    <app-inputfield
                        [formField]="depositForm.notes"
                        label="Notes (optional)"
                        placeholder="Enter deposit notes"
                        type="textarea"
                    />

                    <div class="flex justify-end">
                        <button
                            type="submit"
                            class="btn-primary"
                            [disabled]="depositForm().invalid() || isSubmitting()"
                        >{{ isSubmitting() ? 'Recording...' : 'Make Deposit' }}</button>
                    </div>
                </div>
            </form>
        </section>
    }
</section>
