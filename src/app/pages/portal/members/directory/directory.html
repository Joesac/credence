<section class="mt-6 flex justify-center">
    <div class="px-4 w-full flex flex-col gap-4">
        <app-inputfield
            [(value)]="searchQuery"
            placeholder="Search for members..."
        />

        <app-data-table
          [data]="members()"
          [columns]="tableConfig"
          [loading]="isLoading()"
          [(currentPage)]="currentPage"
          [(pageSize)]="pageSize"
          [totalRecords]="totalRecords()"
        >
          <ng-template appDataTableCell="action" let-member>
            <app-actions-button
              [actions]="actionOptions"
              (onActionSelected)="handleActionSelection($event, member)"
            />
          </ng-template>
        </app-data-table>
    </div>
</section>
