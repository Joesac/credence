<section class="card mt-6 max-width">
  <header class="mb-8">
    <h1 class="text-2xl font-semibold text-text-main">Member Registration</h1>
    <p class="text-text-muted mt-1 text-sm">Fill out the form below to onboard a new member.</p>
  </header>

  <form class="space-y-6" (submit)="onSubmit($event)">
    <app-inputfield
      [formField]="registerForm.fullName"
      label="Fullname"
    />

    <app-inputfield
      [formField]="registerForm.phoneNumber"
      label="Telephone number"
    />

    <app-dropdown 
      [formField]="registerForm.location"
      label="Location"
      [collection]="dropdownItems"
      [inputReadonly]="true"
    />

    <div class="flex justify-end">
      <button
        type="submit"
        matButton="filled"
        color="primary"
        [disabled]="registerForm().invalid() || isSubmitting()"
      >
        {{ isSubmitting() ? 'Registering…' : 'Register' }}
      </button>
    </div>
  </form>
</section>
