<div class="flex items-center justify-between gap-4"
        >
    
    <!-- Icon and Message Group -->
    <div class="flex items-center gap-3">
        <!-- Success State Icon -->
        @if (data.type === 'success') {
            <div class="flex items-center justify-center w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
            </div>
        } 
        <!-- Error State Icon -->
        @else {
            <div class="flex items-center justify-center w-6 h-6 rounded-full bg-rose-500/20 text-rose-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            </div>
        }
        
        <!-- Text Label -->
        <div class="flex flex-col">
            @if (data?.header) {
                <span class="text-sm text-white font-semibold">{{ data.header }}</span>
            }
            <span class="text-sm leading-relaxed text-white">{{ data.message }}</span>
        </div>
    </div>

    <!-- Call to Action Button -->
    @if (data.actionLabel) {
    <button (click)="triggerAction()" 
            class="px-3 py-1.5 text-xs font-semibold rounded-lg tracking-wide transition-all duration-150 cursor-pointer active:scale-95 focus:outline-none"
            [class]="{
                'bg-emerald-500/25 hover:bg-emerald-500/40 text-emerald-300': data.type === 'success',
                'bg-rose-500/25 hover:bg-rose-500/40 text-rose-300': data.type === 'error'
            }">
        {{ data.actionLabel }}
    </button>
    }
</div>
