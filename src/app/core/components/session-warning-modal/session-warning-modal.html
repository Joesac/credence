<div
    class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/60 backdrop-blur-sm transition-all duration-300">
    <div
        class="relative w-full max-w-md p-8 bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 animate-in fade-in zoom-in duration-300">
        <!-- Icon/Visual -->
        <div
            class="flex items-center justify-center w-16 h-16 mx-auto mb-6 rounded-full bg-amber-500/10 text-amber-500">
            <span class="material-symbols-outlined text-4xl animate-pulse">timer</span>
        </div>

        <!-- Content -->
        <div class="text-center mb-8">
            <h3 class="text-2xl font-bold text-slate-900 dark:text-white mb-2">Session Expiring</h3>
            <p class="text-slate-500 dark:text-slate-400">
                You have been inactive for a while. For your security, you will be logged out in:
            </p>

            <!-- Countdown Timer -->
            <div class="mt-6 flex flex-col items-center justify-center">
                <span class="text-5xl font-mono font-black text-amber-500 tracking-tighter">
                    {{ secondsRemaining() }}s
                </span>
            </div>
        </div>

        <!-- Actions -->
        <div class="flex flex-col gap-3">
            <button (click)="onContinue.emit()"
                class="w-full py-3.5 px-6 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-bold transition-all duration-200 shadow-lg shadow-amber-500/25 active:scale-[0.98]">
                Stay Signed In
            </button>
            <p
                class="text-center text-xs text-slate-400 dark:text-slate-500 mt-2 uppercase tracking-widest font-medium">
                Credence Security Protocol
            </p>
        </div>
    </div>
</div>
