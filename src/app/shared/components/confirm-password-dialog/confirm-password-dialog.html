<h2 mat-dialog-title>Confirm Access</h2>
<mat-dialog-content>
  <p class="text-text-muted mb-4">Enter your password to reveal Available Funds.</p>
  <app-inputfield
    label="Password"
    type="password"
    [value]="password()"
    (valueChange)="password.set($event)"
    (keyup.enter)="confirm()"
    [disabled]="isVerifying()"
  />
  @if (errorMessage()) {
    <p class="text-red-500 text-sm mt-2">{{ errorMessage() }}</p>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()" [disabled]="isVerifying()">Cancel</button>
  <button matButton="filled" color="primary" (click)="confirm()" [disabled]="isVerifying()">
    @if (isVerifying()) {
      <span>Verifying...</span>
    } @else {
      <span>Submit</span>
    }
  </button>
</mat-dialog-actions>
