<div class="flex flex-col gap-0.5">
    <label class="font-medium text-text-main">Select Loan</label>
    <app-dropdown
        (inputChange)="handleSearchChange($event)"
        (valueChange)="onLoanSelect($event)"
        placeholder="Search Loan..."
        [collection]="loansToDisplayInDrop()"
        [value]="selectedLoanId()"
    />
</div>
