@let isError = touched() && errors()?.length > 0;

<label 
    class="font-medium text-text-main flex flex-col gap-0.5"
>
    @if (label()) {
        <div class="flex gap-1">
            <span [class.!text-rose-600]="isError">{{ label() }}</span>
            <span class="text-rose-600">{{ errors()?.length > 0 ? ' *' : '' }}</span>
        </div>
    }
    
    @if (type() === 'textarea') {
        <textarea
            rows="5"
            class="w-full py-1 px-4 border rounded-xl outline-none focus:outline-none bg-surface text-text-main placeholder:text-text-muted/50"
            [class.border-rose-600]="isError"
            [class.border-border-base]="!isError"
            [placeholder]="placeholder()"
            [value]="value()"
            [disabled]="disabled()"
            #input
            (input)="value.set(input.value)"
            (blur)="touch.emit()"
            ></textarea>
    } @else {
        <mat-form-field [class.is-error]="isError" subscriptSizing="dynamic">
            <input 
                matInput 
                [type]="type()"
                [value]="value()"
                [disabled]="disabled()"
                [placeholder]="placeholder()"
                [attr.inputmode]="inputMode()"
                #input
                (input)="value.set(input.value)"
                (blur)="touch.emit()"
                (keydown)="onKeydown($event)"
            >
            @if (icon()) {
                <button
                    matSuffix
                    type="button"
                    class="bg-transparent border-0 p-0 me-2 cursor-pointer text-text-muted hover:text-text-main"
                    (click)="iconClick.emit()">
                    <span class="material-symbols-outlined text-xl">{{ icon() }}</span>
                </button>
            }
        </mat-form-field>
    }

    <div class="flex flex-col gap-1">
        @if (hint()) {
            <span class="text-xs text-text-muted">{{ hint() }}</span>
        }
        @if (isError) {
            @for (error of errors(); track error.message) {
                <span class="text-rose-600 text-sm">{{ error?.message }}</span>
            }
        }
    </div>
</label>
