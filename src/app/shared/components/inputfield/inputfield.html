@let isError = touched() && errors()?.length > 0;

<label 
    class="font-medium text-slate-700"
>
    @if (label()) {
        <div class="flex gap-0.5">
            <span [class.!text-red-600]="isError">{{ label() }}</span>
            <span class="text-red-600">{{ errors()?.length > 0 ? ' *' : '' }}</span>
        </div>
    }
    
    @if (type() === 'textarea') {
        <textarea
            rows="5"
            class="w-full py-1 px-4 border rounded-xl outline-none focus:outline-none"
            [class.border-red-600]="isError"
            [class.border-slate-300]="!isError"
            [placeholder]="placeholder()"
            [value]="value()"
            #input
            (blur)="touch.emit()"
            ></textarea>
    } @else {
        <input 
            class="w-full h-10 py-1 px-4 border rounded-xl outline-none focus:outline-none"
            [class.border-red-600]="isError"
            [class.border-slate-300]="!isError"
            [type]="type()"     
            [placeholder]="placeholder()"
            [value]="value()"
            [attr.inputmode]="inputMode()"
            #input
            (input)="value.set(input.value)"
            (blur)="touch.emit()"
            (keydown)="onKeydown($event)"
        />
    }
</label>

@if (touched()) {
    <div class="flex flex-col gap-2">
        @for (error of errors(); track error) {
            <span class="text-red-600 text-sm tex">{{ error?.message }}</span>
        }
    </div>
}
