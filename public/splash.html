<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credence</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #09090B;
      color: #FAFAFA;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    .logo {
      width: 88px;
      height: 88px;
      border-radius: 20px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.55);
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .brand {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(250, 250, 250, 0.12);
      border-top-color: #1ca573;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div class="splash">
    <img src="assets/logo.png" alt="Credence" class="logo">
    <div class="brand">Credence</div>
    <div class="spinner"></div>
  </div>
</body>
</html>
